<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPS 위치 및 이동 경로 시각화</title>

  <!-- Leaflet CSS (API 키 불필요) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #f4f6f9;
      color: #222;
    }
    header {
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 1000;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover {
      background: #2563eb;
    }
    #status {
      padding: 8px 20px;
      background: #e2e8f0;
      font-size: 0.85rem;
      border-bottom: 1px solid #cbd5e1;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    #status.error {
      background: #fee2e2;
      color: #991b1b;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    .legend {
      background: white;
      padding: 10px 12px;
      line-height: 1.6;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      font-size: 0.82rem;
    }
    .legend i {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      border-radius: 50%;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <header>
    <h1>GPS 이동 경로 뷰어 (output.json)</h1>
    <div class="controls">
      <button id="reloadBtn" type="button">데이터 새로고침</button>
      <button id="fitBtn" type="button">전체 경로 보기</button>
    </div>
  </header>

  <div id="status">
    <span id="statusText">output.json 불러오는 중...</span>
    <span id="summaryText"></span>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS (API 키 불필요) -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // 기본 중심 좌표 (데이터 로드 실패 시 서울 시청 기준)
    const map = L.map("map").setView([37.5665, 126.978], 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // 범례 추가
    const legend = L.control({ position: "bottomright" });
    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML =
        '<div><i style="background:#16a34a;"></i>출발 지점</div>' +
        '<div><i style="background:#2563eb;"></i>경유 GPS 포인트</div>' +
        '<div><i style="background:#dc2626;"></i>도착 지점</div>' +
        '<div><span style="display:inline-block;width:14px;height:3px;background:#2563eb;margin-right:6px;vertical-align:middle;"></span>이동 경로</div>';
      return div;
    };
    legend.addTo(map);

    let routeGroup = L.layerGroup().addTo(map);
    let currentBounds = null;

    const statusEl = document.getElementById("status");
    const statusTextEl = document.getElementById("statusText");
    const summaryTextEl = document.getElementById("summaryText");

    function setStatus(message, isError = false, summary = "") {
      statusTextEl.textContent = message;
      summaryTextEl.textContent = summary;
      statusEl.classList.toggle("error", isError);
    }

    // 위도/경도 추출 헬퍼 (다양한 JSON 키 이름 지원)
    function extractLatLng(item) {
      if (Array.isArray(item) && item.length >= 2) {
        // [lat, lng] 또는 [lng, lat] 판별: 한국/일반 위도는 -90~90, 경도는 -180~180
        const a = Number(item[0]);
        const b = Number(item[1]);
        if (Math.abs(a) <= 90 && Math.abs(b) <= 180) {
          return { lat: a, lng: b, raw: item };
        }
      }
      if (item && typeof item === "object") {
        const lat = Number(item.lat ?? item.latitude ?? item.y);
        const lng = Number(item.lng ?? item.lon ?? item.longitude ?? item.x);
        if (!Number.isNaN(lat) && !Number.isNaN(lng)) {
          return {
            lat,
            lng,
            timestamp: item.timestamp ?? item.time ?? item.datetime ?? null,
            label: item.label ?? item.name ?? null,
            raw: item
          };
        }
      }
      return null;
    }

    // JSON 데이터에서 좌표 배열 찾기
    function parsePoints(data) {
      let candidates = [];

      if (Array.isArray(data)) {
        candidates = data;
      } else if (data && typeof data === "object") {
        if (Array.isArray(data.points)) candidates = data.points;
        else if (Array.isArray(data.locations)) candidates = data.locations;
        else if (Array.isArray(data.path)) candidates = data.path;
        else if (Array.isArray(data.route)) candidates = data.route;
        else if (Array.isArray(data.data)) candidates = data.data;
        else if (data.type === "FeatureCollection" && Array.isArray(data.features)) {
          candidates = data.features.map((f) => {
            const coords = f.geometry && f.geometry.coordinates;
            if (Array.isArray(coords) && coords.length >= 2) {
              // GeoJSON은 [lng, lat] 순서
              return {
                lat: Number(coords[1]),
                lng: Number(coords[0]),
                ...(f.properties || {})
              };
            }
            return null;
          }).filter(Boolean);
        } else {
          // 첫 번째 배열 속성 자동 탐색
          const firstArrayKey = Object.keys(data).find((k) => Array.isArray(data[k]));
          if (firstArrayKey) candidates = data[firstArrayKey];
        }
      }

      return candidates.map(extractLatLng).filter((p) => p !== null);
    }

    // 두 좌표 간 거리 계산 (Haversine 공식, 단위: km)
    function calcDistanceKm(p1, p2) {
      const R = 6371;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(p2.lat - p1.lat);
      const dLng = toRad(p2.lng - p1.lng);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(p1.lat)) *
          Math.cos(toRad(p2.lat)) *
          Math.sin(dLng / 2) *
          Math.sin(dLng / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getTotalDistanceKm(points) {
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        total += calcDistanceKm(points[i - 1], points[i]);
      }
      return total;
    }

    function createCircleMarker(latlng, color, radius = 6) {
      return L.circleMarker(latlng, {
        radius,
        fillColor: color,
        color: "#ffffff",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.9
      });
    }

    function formatPopup(point, index, totalCount, roleLabel) {
      const lines = [
        `<strong>${roleLabel} (#${index + 1} / ${totalCount})</strong>`,
        `위도(lat): ${point.lat.toFixed(6)}`,
        `경도(lng): ${point.lng.toFixed(6)}`
      ];
      if (point.label) lines.push(`명칭: ${point.label}`);
      if (point.timestamp) lines.push(`시간: ${point.timestamp}`);
      return lines.join("<br>");
    }

    function renderRoute(points) {
      routeGroup.clearLayers();

      if (!points.length) {
        setStatus("output.json에서 유효한 GPS 좌표를 찾지 못했습니다.", true, "");
        return;
      }

      const latlngs = points.map((p) => [p.lat, p.lng]);

      // 이동 경로 선
      const polyline = L.polyline(latlngs, {
        color: "#2563eb",
        weight: 4,
        opacity: 0.85
      }).addTo(routeGroup);

      // 경유 포인트 마커
      points.forEach((p, idx) => {
        let color = "#2563eb";
        let radius = 5;
        let role = "경유 지점";

        if (idx === 0) {
          color = "#16a34a";
          radius = 8;
          role = "출발 지점";
        } else if (idx === points.length - 1) {
          color = "#dc2626";
          radius = 8;
          role = "도착 지점";
        }

        const marker = createCircleMarker([p.lat, p.lng], color, radius).addTo(routeGroup);
        marker.bindPopup(formatPopup(p, idx, points.length, role));
      });

      currentBounds = polyline.getBounds();
      map.fitBounds(currentBounds, { padding: [30, 30] });

      const distanceKm = getTotalDistanceKm(points);
      setStatus(
        "output.json 로드 완료",
        false,
        `포인트 수: ${points.length}개 | 총 이동거리(직선 구간 합): ${distanceKm.toFixed(2)} km`
      );
    }

    async function loadOutputJson() {
      setStatus("output.json 불러오는 중...", false, "");
      try {
        // 캐시 방지를 위해 쿼리스트링 추가
        const res = await fetch(`./output.json?t=${Date.now()}`);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status} (${res.statusText})`);
        }
        const jsonData = await res.json();
        const points = parsePoints(jsonData);
        renderRoute(points);
      } catch (err) {
        setStatus(
          `불러오기 실패: ${err.message} — 로컬 웹 서버(포트 8000)로 실행 중인지 확인하세요.`,
          true,
          ""
        );
      }
    }

    document.getElementById("reloadBtn").addEventListener("click", loadOutputJson);
    document.getElementById("fitBtn").addEventListener("click", () => {
      if (currentBounds) {
        map.fitBounds(currentBounds, { padding: [30, 30] });
      }
    });

    loadOutputJson();
  </script>
</body>
</html>
